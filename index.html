<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Feras Nabulsi - a digital designer and builder sharing links to portfolio, LinkedIn, and email."
    />
    <title>Feras Nabulsi | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <main class="profile-card" aria-label="Profile card">
        <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode">
          <span class="toggle-icon" aria-hidden="true">🌙</span>
        </button>

        <div class="avatar" aria-label="Profile photo placeholder">FN</div>

        <header class="profile-header">
          <h1>Feras Nabulsi</h1>
          <p>Product-minded builder and creative technologist</p>
        </header>

        <nav class="link-list" aria-label="Social links">
          <a class="link-button" href="https://feras-nabulsi-site.vercel.app/" target="_blank" rel="noreferrer noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M9 7V5.75A1.75 1.75 0 0 1 10.75 4h2.5A1.75 1.75 0 0 1 15 5.75V7h1.5A2.5 2.5 0 0 1 19 9.5v8.75A2.75 2.75 0 0 1 16.25 21h-8.5A2.75 2.75 0 0 1 5 18.25V9.5A2.5 2.5 0 0 1 7.5 7H9Zm2-1.25V7h2V5.75a.25.25 0 0 0-.25-.25h-1.5a.25.25 0 0 0-.25.25Z"/>
                <path d="M8.5 12.5h7v1.5h-7zm0 3h7v1.5h-7z"/>
              </svg>
            </span>
            <span class="label">Portfolio</span>
          </a>

          <a class="link-button" href="https://www.linkedin.com/in/ferasnabulsi/" target="_blank" rel="noreferrer noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M6.94 8.5A1.56 1.56 0 1 1 6.94 5.4a1.56 1.56 0 0 1 0 3.1ZM5.5 9.75h2.88v8.75H5.5zm5.09 0h2.76v1.2h.04c.38-.73 1.32-1.5 2.72-1.5 2.9 0 3.44 1.9 3.44 4.38v4.67h-2.88v-4.38c0-1.04-.02-2.37-1.45-2.37-1.46 0-1.68 1.14-1.68 2.32v4.43H10.59z"/>
              </svg>
            </span>
            <span class="label">LinkedIn</span>
          </a>

          <a class="link-button" href="mailto:feras.nabulsi@slalom.com">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M3.5 6.75A2.75 2.75 0 0 1 6.25 4h11.5A2.75 2.75 0 0 1 20.5 6.75v10.5A2.75 2.75 0 0 1 17.75 20H6.25A2.75 2.75 0 0 1 3.5 17.25zm2.2-.75 6.12 5.22a1.25 1.25 0 0 0 1.36 0l6.12-5.22H5.7Zm13.8 2.52-5.78 4.9a3.25 3.25 0 0 1-3.84 0L4.5 8.52v8.73c0 .69.56 1.25 1.25 1.25h12.5c.69 0 1.25-.56 1.25-1.25z"/>
              </svg>
            </span>
            <span class="label">Email</span>
          </a>
        </nav>

        <footer class="footer-note">Made with 🫖 and Claude Code</footer>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
